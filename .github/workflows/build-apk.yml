name: Build release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders if missing
        id: create
        run: |
          if [ ! -d android ]; then
            flutter create . --project-name smiley_painter --platforms android,ios
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-apk -y --cleanup-tag || true
          gh release create latest-apk build/app/outputs/flutter-apk/app-release.apk \
            --title "Smiley Painter release APK" \
            --notes "Built from ${GITHUB_SHA::7}"

      - name: Commit generated platform folders
        if: steps.create.outputs.generated == 'true'
        run: |
          git config user.name "Icecoldblack"
          git config user.email "Icecoldblack@users.noreply.github.com"
          git add -A android ios .metadata
          git commit -m "Add Android and iOS platform folders [skip ci]"
          git push
